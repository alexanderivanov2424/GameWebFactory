<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games</title>

  <script src="/shared/theme.js"></script>
  <script src="/shared/home.js" defer></script>
  <script src="/shared/settings.js" defer></script>
  <script src="/shared/chat.js" defer></script>

  <style>
    /* Base page styles (body, main, colors) come from /shared/theme.js. */
    h1 { font-size: 2.2rem; margin: 8px 0 24px; }
    .games {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .game {
      position: relative;
      display: block;
      height: 100%;
      padding: 18px;
      background: var(--gwf-surface);
      border: 1px solid var(--gwf-line);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .game:hover { border-color: var(--gwf-accent); box-shadow: 0 4px 16px rgba(74, 92, 255, 0.15); }
    .game h2 { margin: 0 52px 6px 0; font-size: 1.15rem; color: var(--gwf-accent); }
    .game p { margin: 0; color: #555; }
    .message { color: #666; }
    /* Player-count badge (games.json "players", from each game's MIN/MAX_PLAYERS). */
    .players {
      position: absolute;
      top: 10px;
      right: 10px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--gwf-soft);
      color: var(--gwf-accent);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .players svg { width: 12px; height: 12px; fill: currentColor; }
  </style>
</head>
<body>
  <main>
    <h1>Games</h1>
    <p id="message" class="message">Loading games…</p>
    <ul id="games" class="games"></ul>
  </main>

  <script>
    // Little person icon + "2–4" style label, top right of a game card.
    function playersBadge(label) {
      const ns = "http://www.w3.org/2000/svg";
      const icon = document.createElementNS(ns, "svg");
      icon.setAttribute("viewBox", "0 0 16 16");
      const head = document.createElementNS(ns, "circle");
      head.setAttribute("cx", "8"); head.setAttribute("cy", "4.5"); head.setAttribute("r", "3.2");
      const body = document.createElementNS(ns, "path");
      body.setAttribute("d", "M1.5 15.5c0-3.8 2.9-6.3 6.5-6.3s6.5 2.5 6.5 6.3z");
      icon.append(head, body);
      const badge = document.createElement("span");
      badge.className = "players";
      badge.title = `${label} players`;
      const text = document.createElement("span");
      text.textContent = label;
      badge.append(icon, text);
      return badge;
    }

    async function loadGames() {
      const message = document.getElementById("message");
      try {
        const response = await fetch("/games.json", { cache: "no-cache" });
        if (!response.ok) throw new Error(response.status);
        const games = await response.json();

        message.hidden = games.length > 0;
        message.textContent = "No games yet.";

        const list = document.getElementById("games");
        for (const game of games) {
          const link = document.createElement("a");
          link.className = "game";
          link.href = `/games/${encodeURIComponent(game.id)}/`;

          const title = document.createElement("h2");
          title.textContent = game.name;
          const description = document.createElement("p");
          description.textContent = game.description;
          link.append(title, description);
          if (game.players) link.append(playersBadge(game.players));

          const item = document.createElement("li");
          item.append(link);
          list.append(item);
        }
      } catch {
        message.textContent = "Couldn't load the game list.";
      }
    }

    loadGames();
  </script>
</body>
</html>
