<!doctype html>
<!-- Food list (/food-list/): shared shopping lists for phones. Not linked from anywhere.
     Two screens: one list (the title button opens the other) and the lists screen: a stack of lists
     (New list on top, then Global = every saved item, then each list with Edit and, on templates, Copy).
     body.global = the Global list is open: no checking off, clearing or adding; each item has Delete,
     which marks it (red) until the bar at the top confirms or cancels; the editor has no Remove
     (.item-only) and its amount is the default. body.copy = a copy of a template is open: its
     template's name under the title, and Delete list instead of Clear checked / Clear all.
     The list has two modes (the small button next to the title; body.viewing = view mode):
     edit shows the add row and each item's Edit button; view shows the tag filter row instead.
     Logic in app.js; data and pictures are kept by ../server.py (API at /food-list/api/).
     nginx sends a strict Content-Security-Policy for this folder, so no inline scripts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Food list</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
    --accent: #2f7d4f; --accent-text: #fff; --danger: #b3372f; --done: #9a9892;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #22221f; --text: #ecebe6; --muted: #a3a29c; --line: #36352f;
      --accent: #4caf73; --accent-text: #0d1a12; --danger: #e0685f; --done: #75746e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  button, input, textarea { font: inherit; color: inherit; }
  button, .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; white-space: nowrap; user-select: none;
  }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .danger { color: var(--danger); }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: calc(8px + env(safe-area-inset-top)) 12px 10px;
  }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; }
  .bar button { padding: 0 10px; font-size: 14px; }
  .bar .title {
    flex: 1; min-width: 0; justify-content: flex-start; padding: 0 4px; margin-left: -4px;
    border: 0; background: none; font-size: 20px; font-weight: 700;
  }
  .title #listName { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .title .chevron { color: var(--muted); font-size: 14px; }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add input { flex: 1; min-width: 0; }
  .lower { text-transform: lowercase; }
  #suggest {
    list-style: none; margin: 6px 0 0; padding: 0; overflow: hidden;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card);
  }
  #suggest button {
    width: 100%; justify-content: flex-start; border: 0; border-radius: 0; background: none;
    border-top: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis;
  }
  #suggest li:first-child button { border-top: 0; }
  #suggest .suggest-name { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; margin-right: 4px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .hint.bad { color: var(--danger); }
  .bar .mode { min-height: 34px; padding: 0 10px; font-size: 13px; }
  body.viewing .bar .mode { border-color: var(--accent); }
  body.viewing #add, body.viewing #suggest, body.viewing .item .edit, body.viewing #clearAll { display: none; }
  body:not(.viewing) #filters { display: none; }
  body.global .check, body.global #clearChecked, body.global #clearAll, body.global #add,
  body.global #suggest, body.global .item-only { display: none; }
  body.copy #clearChecked, body.copy #clearAll, body:not(.copy) #deleteListTop, body.global #deleteListTop { display: none; }
  .sub { font-size: 13px; color: var(--muted); margin: -2px 0 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qty { font-weight: 500; color: var(--muted); margin-left: 6px; white-space: nowrap; }
  .item.doomed { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--card)); }
  .item.doomed .name { color: var(--danger); }
  .doombar { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--card)); }
  .doombar span { flex: 1; min-width: 0; font-size: 14px; }
  .danger-fill { background: var(--danger); color: #fff; border-color: var(--danger); }
  .pair { display: flex; gap: 8px; }
  .pair > div { flex: 1; min-width: 0; }
  input[type=number] {
    width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card);
  }
  .wide { width: 100%; margin-bottom: 10px; }
  .badge {
    display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; vertical-align: 2px;
    font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--line);
  }
  .checkline { display: flex; align-items: center; gap: 10px; margin-top: 14px; cursor: pointer; }
  .checkline input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); flex: none; }
  /* Tags: --h is the tag's hue, set from the page script. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips:empty { display: none; }
  .tag {
    --h: 0; display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px;
    font-size: 13px; line-height: 20px; white-space: nowrap;
    background: hsl(var(--h) 75% 91%); color: hsl(var(--h) 60% 27%); border: 1px solid hsl(var(--h) 50% 78%);
  }
  button.tag { min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; }
  .tag.plain { background: var(--card); color: var(--text); border-color: var(--line); }
  .tag.new { border-style: dashed; }
  .tag[aria-pressed="true"] { background: hsl(var(--h) 55% 38%); color: #fff; border-color: hsl(var(--h) 55% 38%); }
  .tag.plain[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  @media (prefers-color-scheme: dark) {
    .tag { background: hsl(var(--h) 35% 23%); color: hsl(var(--h) 75% 82%); border-color: hsl(var(--h) 30% 34%); }
    .tag[aria-pressed="true"] { background: hsl(var(--h) 60% 62%); color: #111; border-color: hsl(var(--h) 60% 62%); }
  }
  #filters { margin-top: 10px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .info .chips { margin-top: 5px; }
  #editTags { margin-bottom: 8px; }
  #tagChoices { margin-top: 8px; }
  input[type=text], textarea {
    width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card);
  }
  textarea { resize: vertical; min-height: 90px; }
  main { max-width: 640px; margin: 0 auto; padding: 12px; }
  #list, #lists { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  }
  .check { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; margin: -6px -4px -6px -6px; }
  .check input { width: 26px; height: 26px; accent-color: var(--accent); margin: 0; }
  .info { flex: 1; min-width: 0; cursor: pointer; padding-top: 2px; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .notes { color: var(--muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
  .item.done .name { text-decoration: line-through; color: var(--done); }
  .item.done .notes, .item.done .thumbs { opacity: .55; }
  .item.current { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .edit { flex: none; min-height: 36px; padding: 0 10px; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  #msg {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20;
    max-width: 616px; margin: 0 auto; padding: 12px 14px; border-radius: 10px;
    background: var(--danger); color: #fff; display: none;
  }
  #msg.show { display: block; }
  dialog {
    width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 16px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog label.field { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-top: 8px; }
  .pic { position: relative; }
  .pic img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; cursor: zoom-in; }
  .pic button {
    position: absolute; top: 4px; right: 4px; min-height: 32px; width: 32px; padding: 0;
    border-radius: 50%; background: rgba(0, 0, 0, .65); color: #fff; border: 0;
  }
  .upload { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .upload .btn { flex: 1; }
  .upload input { display: none; }
  #busy { font-size: 14px; color: var(--muted); margin-top: 6px; min-height: 20px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .actions .grow { flex: 1; }
  #viewer { padding: 8px; width: auto; max-width: calc(100vw - 16px); }
  #viewer img { display: block; max-width: calc(100vw - 34px); max-height: calc(100dvh - 90px); margin: 0 auto 8px; border-radius: 8px; }
  #viewer button { width: 100%; }
</style>
<script src="/food-list/app.js" defer></script>
</head>
<body>
<div id="listView">
<header>
  <div class="bar">
    <button type="button" id="listButton" class="title" aria-label="All lists"><span id="listName">Food list</span><span class="chevron" aria-hidden="true">▾</span></button>
    <button type="button" id="modeButton" class="mode">✏️ Edit</button>
    <button type="button" id="clearChecked">Clear checked</button>
    <button type="button" id="clearAll" class="danger">Clear all</button>
    <button type="button" id="deleteListTop" class="danger">Delete list</button>
  </div>
  <div class="sub" id="listSub" hidden></div>
  <form id="add" class="add" autocomplete="off">
    <input type="text" id="addName" class="lower" maxlength="80" placeholder="Add an item…" enterkeyhint="done" autocapitalize="none" aria-label="New item">
    <button type="submit" class="primary">Add</button>
  </form>
  <ul id="suggest" hidden></ul>
  <div id="filters" class="chips" role="group" aria-label="Show only items with a tag"></div>
  <div id="doomBar" class="doombar" hidden>
    <span id="doomText"></span>
    <button type="button" id="doomCancel">Cancel</button>
    <button type="button" id="doomConfirm" class="danger-fill">Delete</button>
  </div>
</header>

<main>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>The list is empty.</p>
</main>
</div>

<div id="listsView" hidden>
<header>
  <div class="bar">
    <h1>Lists</h1>
    <button type="button" id="closeLists">Done</button>
  </div>
</header>

<main>
  <button type="button" id="newListButton" class="primary wide">+ New list</button>
  <ul id="lists"></ul>
</main>
</div>

<dialog id="editor">
  <form method="dialog" id="editForm" autocomplete="off">
    <h2>Edit item</h2>
    <label class="field" for="editName">Name</label>
    <input type="text" id="editName" class="lower" maxlength="80" autocapitalize="none" required>
    <div class="hint">Everything here except the amount is the same on every list.</div>
    <div class="pair">
      <div>
        <label class="field" for="editAmount" id="amountLabel">Amount</label>
        <input type="number" id="editAmount" inputmode="decimal" min="0" max="9999" step="any" placeholder="—">
      </div>
      <div>
        <label class="field" for="editUnit">Unit</label>
        <input type="text" id="editUnit" maxlength="16" placeholder="dozen, lb, pack…">
      </div>
    </div>
    <label class="field" for="editNotes">Notes</label>
    <textarea id="editNotes" maxlength="500" placeholder="Brand, size…"></textarea>
    <label class="field" for="tagInput">Tags</label>
    <div class="chips" id="editTags"></div>
    <div class="add">
      <input type="text" id="tagInput" class="lower" maxlength="24" placeholder="Add or make a tag…" autocapitalize="none" enterkeyhint="done">
      <button type="button" id="addTag">Add</button>
    </div>
    <div class="hint" id="tagHint">Letters and spaces only. Tags stay with the item on every list.</div>
    <div class="chips" id="tagChoices"></div>
    <label class="field">Pictures</label>
    <div class="pics" id="editPics"></div>
    <div class="upload">
      <label class="btn">📷 Take photo<input type="file" id="takePhoto" accept="image/*" capture="environment"></label>
      <label class="btn">🖼️ Choose image<input type="file" id="choosePhoto" accept="image/*" multiple></label>
    </div>
    <div id="busy"></div>
    <div class="hint bad" id="editError"></div>
    <div class="actions">
      <button type="button" id="deleteItem" class="danger item-only">Remove</button>
      <span class="grow"></span>
      <button type="button" id="cancelEdit">Close</button>
      <button type="submit" id="saveEdit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="listEditor">
  <form method="dialog" id="listForm" autocomplete="off">
    <h2>Edit list</h2>
    <label class="field" for="listNameInput">Name</label>
    <input type="text" id="listNameInput" maxlength="40" required>
    <label class="checkline"><input type="checkbox" id="listTemplate"> Template</label>
    <div class="hint bad" id="listError"></div>
    <div class="actions">
      <button type="button" id="deleteList" class="danger">Delete</button>
      <span class="grow"></span>
      <button type="button" id="cancelList">Close</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="nameDialog">
  <form method="dialog" id="nameForm" autocomplete="off">
    <h2 id="nameTitle">New list</h2>
    <label class="field" for="nameInput">Name</label>
    <input type="text" id="nameInput" maxlength="40" required>
    <div class="hint bad" id="nameError"></div>
    <div class="actions">
      <span class="grow"></span>
      <button type="button" id="cancelName">Cancel</button>
      <button type="submit" class="primary" id="nameOk">Create</button>
    </div>
  </form>
</dialog>

<dialog id="viewer">
  <img id="viewerImg" alt="">
  <button type="button" id="closeViewer">Close</button>
</dialog>

<div id="msg" role="alert"></div>
</body>
</html>
